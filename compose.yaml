services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_delivered
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market_delivered']
      interval: 2s
      timeout: 5s
      retries: 15
  postgres-e2e:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_delivered_e2e
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U market -d market_delivered_e2e']
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
